# image_to_keychain — default configuration
# All parameters can be overridden via CLI flags.

input_image: "../Keychain/Gemini_Generated_Image_k3zkqmk3zkqmk3zk.png"
output_basename: "keychain"
output_dir: "out"
output_formats: ["3mf", "stl"]

# Sizing (longest dimension of the final keychain, in mm)
target_size_mm: 60

# Thicknesses (mm) — independently configurable
base_thickness: 2.0
line_thickness: 1.5      # typically > color_thickness so lines pop visually
color_thickness: 1.0

# Keychain tab — a rounded-rectangle lug attached to one side of the
# silhouette that carries the keyring hole. Prevents cutting into the
# subject itself.
tab_enabled: true
tab_side: "top"                 # top | bottom | left | right (plane-Y top, not Z)
tab_position: 0.5               # 0..1 along the side; 0.5 = centered
tab_width_mm: 12.0              # span along the silhouette edge
tab_depth_mm: 8.0               # how far the tab extends outward
tab_corner_radius_mm: 2.5       # rounded corners
tab_overlap_mm: 2.0             # how far the tab reaches into the silhouette

# Keychain hole (sits inside the tab when tab_enabled=true)
hole_type: "round"              # round | double | slot | none
hole_diameter: 4.0
hole_spacing: 6.0               # double only, center-to-center
hole_slot_length: 8.0
hole_slot_width: 4.0
hole_edge_margin: 3.0           # mm from hole edge to tab outer edge

# Used only when tab_enabled=false (legacy "hole cut into silhouette" mode)
hole_position: "top-center"     # top-left | top-center | top-right | left-center | right-center | custom
hole_custom_offset: [0, 0]      # mm from silhouette bounding-box top-left (x, y)

# Vectorization
vectorizer: "vtracer"           # vtracer | potrace
simplify_tolerance: 0.5         # higher = fewer polygons
alpha_threshold: 128            # transparent background cutoff (0-255)

# When the image has no real transparency (alpha=255 everywhere, common for
# AI-generated PNGs with a baked-in grey/checkerboard background), the
# pipeline auto-detects bg clusters by sampling the 4 image corners.
corner_patch_px: 24             # size of each corner sampling square
corner_bg_ratio: 0.10           # cluster flagged as bg if it covers >=10% of corners
background_cluster_ids: []      # manual override — list of cluster ids to force-drop

# Color clustering — tones/shades of the same hue are merged into one
# cluster, so soft shading does NOT create a spurious line.
max_colors: 6                   # k-means cluster count (AMS-friendly: 4-6)
kmeans_seed: 0                  # deterministic runs
kmeans_sample: 20000            # pixels sampled to fit centroids
kmeans_iters: 15

# Line extraction (color-boundary detection)
line_dilate_px: 2               # 2D dilation so boundary lines are printable
line_include_silhouette_edge: true   # true = outer outline included as a line

# Quality
mesh_resolution: "medium"       # low | medium | high — tessellation detail

# Logging
verbose: true
save_intermediate: true         # write SVGs and preview PNGs to intermediate/
